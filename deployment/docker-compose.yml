# Autor: oswaldo.diaz@inegi.org.mx
# Especificación de la versión del formato de Docker Compose
version: '3.8'
# Definición del bloque principal de servicios del sistema multiagente
services:
  # Definición del servicio para el Agente de Descubrimiento de Activos
  asset-discovery-agent:
    # Indicación del contexto de construcción usando el Dockerfile local
    build: .
    # Definición del nombre único del contenedor en ejecución
    container_name: asset_discovery_agent
    # Comando de ejecución que arranca el script independiente del agente
    command: python agent_asset_discovery.py
    # Política de reinicio automático para garantizar alta disponibilidad y resiliencia
    restart: always
    # Red interna compartida para la comunicación entre agentes
    networks:
      - mcp_cyber_resilience_net

  # Definición del servicio para el Agente de Evaluación de Riesgos
  risk-assessment-agent:
    # Indicación del contexto de construcción del contenedor
    build: .
    # Nombre único del contenedor para el agente de riesgos
    container_name: risk_assessment_agent
    # Comando para iniciar el módulo de evaluación de riesgos
    command: python agent_risk_assessment.py
    # Reinicio automático en caso de fallo
    restart: always
    # Conexión a la red interna del sistema
    networks:
      - mcp_cyber_resilience_net

  # Definición del servicio para el Agente de Validación de Contexto (AI Safety)
  context-validation-agent:
    # Indicación del contexto de construcción
    build: .
    # Nombre del contenedor asignado al módulo de validación
    container_name: context_validation_agent
    # Comando de ejecución para el componente de validación semántica e IA Safety
    command: python agent_context_validation.py
    # Política de reinicio continuo
    restart: always
    # Asignación a la red de comunicación compartida
    networks:
      - mcp_cyber_resilience_net

  # Definición del servicio para el Agente de Detección de Amenazas
  threat-detection-agent:
    # Definición de compilación mediante Dockerfile
    build: .
    # Nombre del contenedor del motor de detección
    container_name: threat_detection_agent
    # Comando para ejecutar el motor de inferencia y análisis de logs
    command: python agent_threat_detection.py
    # Reinicio automático en todo momento
    restart: always
    # Incorporación a la red de agentes
    networks:
      - mcp_cyber_resilience_net

  # Definición del servicio para el Agente de Respuesta Automatizada
  automated-response-agent:
    # Contexto de construcción del contenedor
    build: .
    # Nombre del contenedor de respuesta defensiva
    container_name: automated_response_agent
    # Comando de ejecución para las acciones defensivas automatizadas
    command: python agent_automated_response.py
    # Política de reinicio automático
    restart: always
    # Integración a la red interna
    networks:
      - mcp_cyber_resilience_net

  # Definición del servicio para el Agente de Recuperación
  recovery-agent:
    # Contexto de construcción
    build: .
    # Nombre del contenedor para la restauración operacional
    container_name: recovery_agent
    # Comando de inicio del script de recuperación y resiliencia
    command: python agent_recovery.py
    # Reinicio automático continuo
    restart: always
    # Conexión con la red del ecosistema
    networks:
      - mcp_cyber_resilience_net

  # Definición del servicio para el Agente de Gobernanza
  governance-agent:
    # Contexto de compilación
    build: .
    # Nombre asignado al contenedor del módulo de gobernanza
    container_name: governance_agent
    # Comando para iniciar la supervisión normativa y métricas
    command: python agent_governance.py
    # Política de reinicio en todo escenario de fallo
    restart: always
    # Conexión a la red distribuida de la arquitectura
    networks:
      - mcp_cyber_resilience_net

# Definición del bloque de redes virtuales personalizadas
networks:
  # Nombre del controlador de red bridge aislado para los agentes MCP
  mcp_cyber_resilience_net:
    # Utilización del driver estándar tipo bridge para aislamiento seguro
    driver: bridge
